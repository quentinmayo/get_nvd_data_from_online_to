[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "get_nvd_data_from_online_to"
version = "2.0.0"
description = "Export NVD vulnerability data to files, SQLite, PostgreSQL, or MySQL"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Quentin Mayo"}]
dependencies = ["requests>=2.32.4,<3", "SQLAlchemy>=2.0.41,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["PyMySQL[rsa]>=1.1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
nvd-export = "nvd_exporter.cli:main"

[project.urls]
Repository = "https://github.com/quentinmayo/get_nvd_data_from_online_to"
Issues = "https://github.com/quentinmayo/get_nvd_data_from_online_to/issues"

[tool.setuptools.packages.find]
include = ["nvd_exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL or MySQL test database"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m 'not integration'
      - run: python -m build
      - run: nvd-export --help

  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: nvd_test
          POSTGRES_DB: nvd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres -d nvd_test'
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nvd_test
          MYSQL_DATABASE: nvd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd 'mysqladmin ping -h 127.0.0.1 -pnvd_test'
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,postgres,mysql]'
      - run: pytest -m integration
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:nvd_test@127.0.0.1:5432/nvd_test
          TEST_MYSQL_URL: mysql+pymysql://root:nvd_test@127.0.0.1:3306/nvd_test?charset=utf8mb4
